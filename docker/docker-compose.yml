# LAB ONLY. Primary = minelab (5436); restore target = separate instance (5435).
services:
  primary:
    image: postgres:16
    container_name: dbalab-primary
    env_file: ../.env
    ports: ["${PG_PORT:-5436}:5432"]
    command: ["postgres","-c","log_min_duration_statement=500","-c","log_connections=on","-c","log_lock_waits=on","-c","deadlock_timeout=1s","-c","shared_preload_libraries=pg_stat_statements"]
    volumes:
      - primary_data:/var/lib/postgresql/data
      - ../sql/schema/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../sql/roles/01_roles.sql:/docker-entrypoint-initdb.d/02_roles.sql:ro
      - ../sql/roles/02_verify_access.sql:/verify/verify_access.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
  restore:
    image: postgres:16
    container_name: dbalab-restore
    env_file: ../.env
    ports: ["${RESTORE_PG_PORT:-5435}:5432"]
    volumes: [restore_data:/var/lib/postgresql/data]
  replica:
    image: postgres:16
    container_name: dbalab-replica
    env_file: ../.env
    ports: ["${REPLICA_PG_PORT:-5434}:5432"]
    entrypoint: ["bash","/replica-entrypoint.sh"]
    depends_on: [primary]
    volumes:
      - replica_data:/var/lib/postgresql/data
      - ./replica-entrypoint.sh:/replica-entrypoint.sh:ro
volumes:
  primary_data:
  replica_data:
  restore_data:
